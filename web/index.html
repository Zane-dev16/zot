<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zot chat</title>
  <link rel="stylesheet" href="/style.css" />
  <main>
    <header>
      <h1>zot chat</h1>
      <p id="status" data-kind="connecting">connecting</p>
      <div id="connRow">
        <span id="retryCount" aria-live="polite"></span>
        <button id="retryNow" type="button">Retry now</button>
      </div>
    </header>
    <section id="auth">
      <label class="hidden" for="token">Device token</label>
      <input
        id="token"
        type="password"
        placeholder="device token"
        autocomplete="off"
        aria-label="Device token"
      />
      <button id="saveToken" type="button">Save</button>
    </section>
    <section id="log" aria-live="polite"></section>
    <form id="composer">
      <label class="hidden" for="box">Prompt</label>
      <input
        id="box"
        placeholder="type here"
        autocomplete="off"
        aria-label="Prompt"
      />
      <button type="submit">Send</button>
    </form>
    <section id="activityWrap">
      <h2>Activity <span id="activityCount" aria-live="polite"></span></h2>
      <div id="activityRow">
        <button id="refreshActivity" type="button">Refresh</button>
        <span id="activityError" aria-live="polite"></span>
      </div>
      <ul id="activity"></ul>
    </section>
    <template id="approvalTemplate">
      <div class="approvalRow">
        <button type="button" data-action="approve">Approve</button>
        <button type="button" data-action="cancel">Cancel</button>
      </div>
    </template>
  </main>
  <script src="/app.js"></script>
</html>
